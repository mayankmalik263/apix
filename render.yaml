# Render blueprint. Push this repo to GitHub, then New > Blueprint on Render
# and point it at the repo.
#
# The disk matters more than the plan: Bronze is an append-only archive of
# fares that cannot be re-collected, so it needs storage that survives a
# deploy. A free instance that sleeps will also miss its collection slot —
# the catch-up run covers a short nap, not an overnight one.
services:
  - type: web
    name: apix
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /v1/health
    envVars:
      - key: APIX_DB_PATH
        value: /data/apix.db
      - key: TZ
        value: Asia/Kolkata
    disk:
      name: apix-data
      mountPath: /data
      sizeGB: 5
