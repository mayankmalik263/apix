<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" height="100%" style="background-color: #0f172a; border-radius: 8px; border: 1px solid #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <style>
    /* Institutional & Interactive Styles */
    .axis-label { font-size: 11px; fill: #64748b; }
    .axis-line { stroke: #334155; stroke-width: 1; }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
    
    /* Interactive Column Triggers */
    .col-group { cursor: pointer; }
    .col-hover { opacity: 0; transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
    .col-group:hover .col-hover { opacity: 1; }
    
    .data-point { transition: transform 0.2s ease, filter 0.2s ease; transform-origin: center; transform-box: fill-box; }
    .col-group:hover .data-point { transform: scale(1.4); filter: drop-shadow(0 0 6px #38bdf8); }
    
    .active-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <defs>
    <!-- Muted institutional gradient -->
    <linearGradient id="curveGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01" />
    </linearGradient>
    
    <!-- Marker filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Header Section -->
  <g transform="translate(35, 36)">
    <text x="0" y="0" fill="#f8fafc" font-size="15" font-weight="600" letter-spacing="-0.2px">Empirical Booking Lead-Time Curve: Domestic Economy Fares</text>
    <text x="0" y="18" fill="#94a3b8" font-size="11.5">Median fares (P₅₀) across 30 market cells (6 routes × 5 windows) · MoSPI Base 2026-09-03</text>
    
    <!-- Legend / Interactive Prompt -->
    <g transform="translate(610, -5)">
      <circle cx="0" cy="5" r="4" fill="#38bdf8" />
      <text x="10" y="9" fill="#94a3b8" font-size="11">Hover points for breakdown</text>
    </g>
  </g>

  <!-- Y-Axis Ticks & Grid (Scale: ₹8,000 at y=310, ₹16,000 at y=90 -> Height 220px, 8000 spread = 0.0275 px/₹) -->
  <g transform="translate(0, 0)">
    <!-- ₹16,000 (y = 90) -->
    <line x1="85" y1="90" x2="775" y2="90" class="grid-line" />
    <text x="75" y="94" class="axis-label" text-anchor="end">₹16,000</text>
    <line x1="80" y1="90" x2="85" y2="90" class="axis-line" />

    <!-- ₹14,000 (y = 145) -->
    <line x1="85" y1="145" x2="775" y2="145" class="grid-line" />
    <text x="75" y="149" class="axis-label" text-anchor="end">₹14,000</text>
    <line x1="80" y1="145" x2="85" y2="145" class="axis-line" />

    <!-- ₹12,000 (y = 200) -->
    <line x1="85" y1="200" x2="775" y2="200" class="grid-line" />
    <text x="75" y="204" class="axis-label" text-anchor="end">₹12,000</text>
    <line x1="80" y1="200" x2="85" y2="200" class="axis-line" />

    <!-- ₹10,000 (y = 255) -->
    <line x1="85" y1="255" x2="775" y2="255" class="grid-line" />
    <text x="75" y="259" class="axis-label" text-anchor="end">₹10,000</text>
    <line x1="80" y1="255" x2="85" y2="255" class="axis-line" />

    <!-- ₹8,000 (y = 310) -->
    <line x1="85" y1="310" x2="775" y2="310" class="axis-line" />
    <text x="75" y="314" class="axis-label" text-anchor="end">₹8,000</text>
    <line x1="80" y1="310" x2="85" y2="310" class="axis-line" />

    <!-- Y Axis Spine -->
    <line x1="85" y1="80" x2="85" y2="310" class="axis-line" />
  </g>

  <!-- Area under Curve -->
  <!-- 
    T+1:  x = 130, y = 124  (₹14,781)
    T+7:  x = 280, y = 241  (₹10,500)
    T+14: x = 430, y = 267  (₹9,550)
    T+21: x = 580, y = 281  (₹9,043)
    T+45: x = 720, y = 261  (₹9,800)
  -->
  <path d="M 130 124
           C 200 180, 230 232, 280 241
           C 330 250, 380 263, 430 267
           C 480 271, 530 281, 580 281
           C 630 281, 670 272, 720 261
           L 720 310
           L 130 310 Z"
        fill="url(#curveGradient)" />

  <!-- The Median Curve Line -->
  <path d="M 130 124
           C 200 180, 230 232, 280 241
           C 330 250, 380 263, 430 267
           C 480 271, 530 281, 580 281
           C 630 281, 670 272, 720 261"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2.5"
        stroke-linecap="round" />

  <!-- Static Annotations (Clean, subtle institutional labels) -->
  <!-- T+1 Surge -->
  <text x="130" y="108" fill="#f87171" font-size="11.5" font-weight="600" text-anchor="middle">₹14,781</text>
  <text x="130" y="94" fill="#ef4444" class="active-tag" text-anchor="middle">Last-Minute Surge (+63.4%)</text>

  <!-- T+7 -->
  <text x="280" y="228" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">₹10,500</text>

  <!-- T+14 -->
  <text x="430" y="254" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">₹9,550</text>

  <!-- T+21 Sweet Spot -->
  <text x="580" y="302" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">₹9,043</text>
  <rect x="505" y="322" width="150" height="20" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
  <text x="580" y="336" fill="#6ee7b7" class="active-tag" text-anchor="middle">★ P₅₀ Minimum (Sweet Spot)</text>

  <!-- T+45 Advance Rebound -->
  <text x="720" y="248" fill="#fbbf24" font-size="11.5" font-weight="600" text-anchor="middle">₹9,800</text>
  <text x="720" y="234" fill="#f59e0b" class="active-tag" text-anchor="middle">Advance Rebound (+8.4%)</text>

  <!-- X-Axis Labels & Ticks -->
  <g transform="translate(0, 310)">
    <!-- T+1 -->
    <line x1="130" y1="0" x2="130" y2="6" class="axis-line" />
    <text x="130" y="22" class="axis-label" text-anchor="middle" font-weight="600" fill="#cbd5e1">T+1</text>
    <text x="130" y="35" class="axis-label" text-anchor="middle">1 Day Out</text>

    <!-- T+7 -->
    <line x1="280" y1="0" x2="280" y2="6" class="axis-line" />
    <text x="280" y="22" class="axis-label" text-anchor="middle" font-weight="600" fill="#cbd5e1">T+7</text>
    <text x="280" y="35" class="axis-label" text-anchor="middle">1 Week Out</text>

    <!-- T+14 -->
    <line x1="430" y1="0" x2="430" y2="6" class="axis-line" />
    <text x="430" y="22" class="axis-label" text-anchor="middle" font-weight="600" fill="#cbd5e1">T+14</text>
    <text x="430" y="35" class="axis-label" text-anchor="middle">2 Weeks Out</text>

    <!-- T+21 (Highlighted as reference) -->
    <line x1="580" y1="0" x2="580" y2="6" stroke="#10b981" stroke-width="1.5" />
    <text x="580" y="22" class="axis-label" text-anchor="middle" font-weight="700" fill="#34d399">T+21</text>
    <text x="580" y="35" class="axis-label" text-anchor="middle" fill="#10b981">MoSPI Window</text>

    <!-- T+45 -->
    <line x1="720" y1="0" x2="720" y2="6" class="axis-line" />
    <text x="720" y="22" class="axis-label" text-anchor="middle" font-weight="600" fill="#cbd5e1">T+45</text>
    <text x="720" y="35" class="axis-label" text-anchor="middle">45 Days Out</text>
  </g>

  <!-- ================================================================= -->
  <!-- INTERACTIVE COLUMN OVERLAYS (Hover to reveal detailed inspection) -->
  <!-- ================================================================= -->

  <!-- Column 1: T+1 -->
  <g class="col-group">
    <!-- Invisible trigger area -->
    <rect x="85" y="80" width="95" height="230" fill="transparent" />
    <!-- Data point dot -->
    <circle cx="130" cy="124" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" class="data-point" />
    <!-- Hover Crosshair & Details -->
    <g class="col-hover">
      <line x1="130" y1="80" x2="130" y2="310" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <rect x="65" y="145" width="130" height="50" rx="6" fill="#1e293b" stroke="#334155" filter="url(#softShadow)" />
      <text x="130" y="163" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Window: T+1</text>
      <text x="130" y="177" fill="#f87171" font-size="11" text-anchor="middle">P₅₀: ₹14,781</text>
      <text x="130" y="189" fill="#94a3b8" font-size="9" text-anchor="middle">Max route: BOM-BLR (₹16.4k)</text>
    </g>
  </g>

  <!-- Column 2: T+7 -->
  <g class="col-group">
    <rect x="235" y="80" width="95" height="230" fill="transparent" />
    <circle cx="280" cy="241" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" class="data-point" />
    <g class="col-hover">
      <line x1="280" y1="80" x2="280" y2="310" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <rect x="215" y="160" width="130" height="50" rx="6" fill="#1e293b" stroke="#334155" filter="url(#softShadow)" />
      <text x="280" y="178" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Window: T+7</text>
      <text x="280" y="192" fill="#38bdf8" font-size="11" text-anchor="middle">P₅₀: ₹10,500</text>
      <text x="280" y="204" fill="#94a3b8" font-size="9" text-anchor="middle">Near-term corporate travel</text>
    </g>
  </g>

  <!-- Column 3: T+14 -->
  <g class="col-group">
    <rect x="385" y="80" width="95" height="230" fill="transparent" />
    <circle cx="430" cy="267" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" class="data-point" />
    <g class="col-hover">
      <line x1="430" y1="80" x2="430" y2="310" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <rect x="365" y="180" width="130" height="50" rx="6" fill="#1e293b" stroke="#334155" filter="url(#softShadow)" />
      <text x="430" y="198" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Window: T+14</text>
      <text x="430" y="212" fill="#38bdf8" font-size="11" text-anchor="middle">P₅₀: ₹9,550</text>
      <text x="430" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">Planned leisure trips</text>
    </g>
  </g>

  <!-- Column 4: T+21 (MoSPI Reference) -->
  <g class="col-group">
    <rect x="535" y="80" width="95" height="230" fill="transparent" />
    <circle cx="580" cy="281" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="2" class="data-point" />
    <g class="col-hover">
      <line x1="580" y1="80" x2="580" y2="310" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
      <rect x="510" y="180" width="140" height="52" rx="6" fill="#1e293b" stroke="#059669" filter="url(#softShadow)" />
      <text x="580" y="198" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">MoSPI Standard: T+21</text>
      <text x="580" y="212" fill="#ffffff" font-size="11" text-anchor="middle">P₅₀: ₹9,043 (Minimum)</text>
      <text x="580" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">Min route: BLR-HYD (₹5.8k)</text>
    </g>
  </g>

  <!-- Column 5: T+45 -->
  <g class="col-group">
    <rect x="675" y="80" width="95" height="230" fill="transparent" />
    <circle cx="720" cy="261" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" class="data-point" />
    <g class="col-hover">
      <line x1="720" y1="80" x2="720" y2="310" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <rect x="650" y="160" width="140" height="50" rx="6" fill="#1e293b" stroke="#334155" filter="url(#softShadow)" />
      <text x="720" y="178" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Window: T+45</text>
      <text x="720" y="192" fill="#fbbf24" font-size="11" text-anchor="middle">P₅₀: ₹9,800 (+8.4%)</text>
      <text x="720" y="204" fill="#94a3b8" font-size="9" text-anchor="middle">Rebound on 5 of 6 routes</text>
    </g>
  </g>
</svg>
