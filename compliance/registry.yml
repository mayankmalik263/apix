# Collection etiquette. These are enforced in code, not aspirational.
etiquette:
  user_agent: "APIx-Research/0.1 (SIH26056 airfare price index; contact: mayankmalik.13857@stu.upes.ac.in)"
  min_seconds_between_requests: 20
  max_requests_per_source_per_day: 30
  respect_crawl_delay: true
  obey_robots: true
  # Non-negotiable. Present so a reader can see it is a setting we never flip.
  bypass_captcha: false
  rotate_ip: false
