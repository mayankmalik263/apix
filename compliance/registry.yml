# APIx source compliance registry
# --------------------------------
# This file is NOT documentation. The collector reads it at runtime and refuses
# to issue any request against a source whose verdict is not PERMITTED with a
# check dated today. A fetch against an uncleared source raises BEFORE the
# network call happens.
#
# verdict values:
#   PERMITTED   robots.txt allows the fare path, ToS reviewed, collection OK
#   DISALLOWED  robots.txt or ToS forbids it -- we do not request it
#   BLOCKED     bot wall / challenge encountered -- we do not attempt to defeat it
#   UNKNOWN     not yet checked. Treated exactly like DISALLOWED by the gate.
#
# Every verdict here starts UNKNOWN. `apix compliance --check` fetches each
# robots.txt, hashes it into compliance/evidence/, and writes the real verdict
# to the database. Nobody types a verdict by hand.

sources:
