<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<title>Sign in — APIx</title>
<style>
  .mid { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .box { width: 100%; max-width: 392px; }
  .box h1 { font-size: 21px; font-weight: 650; letter-spacing: -.024em; margin: 0 0 5px; }
  .box .s { color: var(--text-3); font-size: 13.5px; margin: 0 0 24px; }
  .f { margin-bottom: 15px; }
  .f label { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
             text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; }
  .f input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--edge);
             background: var(--ink-2); color: var(--text); font-family: var(--face); font-size: 14.5px; }
  .f input:focus { border-color: var(--beam); }
  .go { width: 100%; padding: 11px; border-radius: 8px; border: 0; background: var(--beam);
        color: var(--ink); font-family: var(--face); font-size: 14px; font-weight: 650; cursor: pointer; }
  .go:hover { filter: brightness(1.08); }
  .back { display: block; text-align: center; margin-top: 18px; font-size: 12.5px;
          color: var(--text-3); text-decoration: none; }
  .back:hover { color: var(--text-2); }
</style>
</head>
<body>
<div class="mid"><div class="box">
  <a class="logo" href="/" style="justify-content:center;margin-bottom:20px">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:22px;height:22px">
      <path d="M2 17.5 22 6.2M2 17.5l4.4.9 3.1-2M22 6.2l-3.6-1.8-4.2 2.4M9 20.6l1.9-3.4"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="10.2" stroke="currentColor" stroke-width="1.1" opacity=".28"/>
    </svg><b>APIx</b></a>
  <div class="card"><div class="card-b">
    <h1>Operator sign in</h1>
    <p class="s">Issue API keys, trigger a collection, read the access log.</p>
    <div id="err" class="note" style="border-left-color:var(--alert);margin-top:0" hidden></div>
    <form method="post" action="/auth/login">
      <div class="f"><label for="email">Email</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="username"></div>
      <div class="f"><label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="go" type="submit">Sign in</button>
    </form>
    <a class="back" href="/">Back to the dashboard</a>
  </div></div>
  <p style="text-align:center;color:var(--text-3);font-size:12px;margin-top:16px">
    Accounts are created from a shell: <code>python -m apix.cli useradd</code></p>
</div></div>
<script>
  const p = new URLSearchParams(location.search), e = p.get("error");
  if (e) { const b = document.getElementById("err"); b.textContent = e; b.hidden = false;
           history.replaceState({}, "", location.pathname); }
</script>
</body></html>
